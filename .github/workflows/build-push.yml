name: Build and Push to ECR

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REPO_NAME: tinypixo
  AWS_REGION: us-east-1

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Check if tag already exists
        id: tag_check
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.version.outputs.version }} already exists, skipping build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.tag_check.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build image
        if: steps.tag_check.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.REPO_NAME }}:${{ steps.version.outputs.version }}

      - name: Configure AWS credentials
        if: steps.tag_check.outputs.exists == 'false'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECR repository exists
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          if ! aws ecr describe-repositories --repository-names "$REPO_NAME" --region "$AWS_REGION" > /dev/null 2>&1; then
            echo "ECR repository '$REPO_NAME' not found. Creating it..."
            aws ecr create-repository --repository-name "$REPO_NAME" --region "$AWS_REGION"
          fi

      - name: Login to ECR
        if: steps.tag_check.outputs.exists == 'false'
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push image to ECR
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          ECR_URI="${{ steps.ecr_login.outputs.registry }}/${{ env.REPO_NAME }}"
          VERSION="${{ steps.version.outputs.version }}"

          docker tag "$REPO_NAME:$VERSION" "$ECR_URI:$VERSION"
          docker tag "$REPO_NAME:$VERSION" "$ECR_URI:latest"

          docker push "$ECR_URI:$VERSION"
          docker push "$ECR_URI:latest"

          echo "Pushed $ECR_URI:$VERSION"

      - name: Create and push git tag
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git tag "$VERSION"
          git push origin "$VERSION"
